name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aalim:aalim@localhost:5432/aalim
      DATABASE_APP_URL: postgresql://aalim_app:aalim_app@localhost:5432/aalim
      TEST_DATABASE_URL: postgresql://aalim:aalim@localhost:5432/aalim_test
      BETTER_AUTH_SECRET: ci-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE ROLE aalim LOGIN PASSWORD 'aalim' CREATEDB" \
            -c "CREATE ROLE aalim_app LOGIN PASSWORD 'aalim_app'" \
            -c "CREATE DATABASE aalim OWNER aalim" \
            -c "CREATE DATABASE aalim_test OWNER aalim"
      - run: npm ci
      - run: npx prisma migrate deploy && npx prisma generate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
